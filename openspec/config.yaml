schema: spec-driven

context: |
  Language: es
  All artifacts must be written in es.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Caso: cafetería de campus. La arquitectura y las funcionalidades replican el parcial de reservas de coworking ya sustentado.
  API REST en Express. SQL Server guarda lo transaccional. MongoDB guarda comentarios y el historial de actividad.
  Acceso con JWT y dos perfiles: Administrador y Cliente.
  Un pedido confirma un solo producto y una cantidad entera. La regla de conflicto es el stock, decidida dentro de SQL Server.
  Entrega en tres carpetas: api/, sql/ y mongo/.
  Esta fase es solo planificación. No hay código de aplicación que modificar.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
